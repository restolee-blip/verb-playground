<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>움직여라! 동사 놀이터</title>
<style>
:root{font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#192e40;background:#fcf7ec;font-weight:650;--line:#b6c5cc}*{box-sizing:border-box}body{margin:0;word-break:keep-all}header,main,footer{max-width:1180px;margin:auto;padding:clamp(12px,3vw,28px)}header,footer,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between;border-bottom:1px solid #ddd0bc}header strong{font-size:clamp(19px,3vw,26px)}main{min-height:62vh}h1{font-size:clamp(30px,5vw,48px);margin:.35em 0}p{font-size:clamp(19px,3.1vw,24px);line-height:1.5}button,select,input,textarea{font:inherit;color:inherit}button,select,input:not([type=checkbox]),textarea{min-height:56px;border:2px solid var(--line);border-radius:16px;background:#fff;padding:8px 15px;max-width:100%}button{font-size:clamp(18px,2.4vw,23px);cursor:pointer;touch-action:manipulation}button:hover{border-color:#527180}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #23577a;outline-offset:3px}button.primary{background:#d7edf7;border-color:#7196aa}button[aria-pressed=true]{background:#e3efca;border-color:#477036}button[aria-pressed=true]::after{content:" ✓"}button:disabled{opacity:.52;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,225px),1fr));gap:16px}.card{padding:0;overflow:hidden;background:#fff;width:100%;text-align:center}.card img,.picture{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#eadfce}.card span{display:block;padding:12px}.place>.picture{object-fit:cover}.panel{background:#fff;border:1px solid #ddd0bc;border-radius:24px;padding:clamp(12px,3vw,25px);margin:14px 0}.featured{max-width:min(100%,650px);margin:12px auto}.word{text-align:center;font-size:clamp(36px,7vw,58px);min-height:1.2em;margin:.15em}.center{justify-content:center;text-align:center}.caption{text-align:center;font-size:clamp(21px,4vw,30px)}.board{position:relative;overflow:hidden;aspect-ratio:4/3;border-radius:20px;background:linear-gradient(#f5ebd9 67%,#e5cfa9 67%);border:2px solid #a8896e;width:min(100%,73vh);width:min(100%,73svh);margin-inline:auto;user-select:none}.board img{position:absolute;object-fit:contain;pointer-events:none;-webkit-user-drag:none}.drag{position:absolute;z-index:2;touch-action:none;background:transparent;border:0;padding:0;min-height:0;cursor:grab}.drag img{width:100%;height:100%;inset:0}.drag:active{cursor:grabbing}.label{display:grid;gap:6px;margin:10px 0}.teacher button,.teacher select,.teacher input,.teacher textarea{font-size:17px}.notice{min-height:1.5em;margin:10px 0}.hide,.print{display:none}footer{padding-bottom:max(18px,env(safe-area-inset-bottom))}.tiles{display:grid;gap:12px;grid-template-columns:repeat(var(--cols),minmax(0,1fr))}.place{position:relative}.hotspots{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}.hotspots button{background:transparent;border:2px dashed #fff;color:#182c41;align-content:end;text-shadow:0 0 5px #fff}.hotspots span{background:white;border-radius:12px;padding:4px 10px}.small{font-size:16px}.pulse{animation:pulse .6s ease}@keyframes pulse{50%{transform:scale(.98)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{grid-template-columns:repeat(min(var(--cols),2),minmax(0,1fr))}.row{gap:8px}.teacher input,.teacher textarea{width:100%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}@page{size:A4;margin:10mm}@media print{body{background:white}header,main,footer{display:none}.print{display:block}.sheet{display:grid;grid-template-columns:repeat(var(--print-cols),1fr);gap:4mm;break-after:page;align-content:start}.sheet:last-child{break-after:auto}.sheet figure{margin:0;border:1px solid #888;padding:2mm;break-inside:avoid;text-align:center}.sheet img{width:100%;height:var(--print-h);object-fit:contain;display:block}.sheet figcaption{font-size:16pt;padding:2mm}}

/* Shared navigation and activity controls */
button:has(.control-icon){display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2}
.control-icon{display:block;width:24px;height:24px;object-fit:contain;flex:none;pointer-events:none}
button[data-do=back] .control-icon,button[data-do=cardPrev] .control-icon{transform:scaleX(-1)}
.play-controls{width:min(100%,840px);margin:16px auto 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.play-controls[data-count="1"]{grid-template-columns:minmax(0,1fr);max-width:340px}
.play-controls[data-count="3"] button:first-child{grid-column:1/-1}
.play-controls button{display:flex;align-items:center;justify-content:center;min-width:0;min-height:56px;width:100%;padding:10px 8px;font-size:clamp(16px,2.3vw,20px);font-weight:750;line-height:1.25;text-align:center;border-color:#8295a0;background:#fffdf7}
.play-controls button span{min-width:0;overflow-wrap:anywhere}
.play-controls button.primary{color:#fff;background:#254e65;border-color:#254e65}
.play-controls button.primary .control-icon{filter:brightness(0) invert(1)}
.play-controls button[data-do=demo],.play-controls button[data-do=detectSpeak]{background:#fff0d0;border-color:#a8874c}
.play-controls button[data-do=magicNext],.play-controls button[data-do=secretNext],.play-controls button[data-do=placeNext],.play-controls button[data-do=cardNext]{background:#e2f0f7;border-color:#67869a}
.play-controls button:active:not(:disabled){box-shadow:inset 0 0 0 2px currentColor}
@media(min-width:720px){
 .play-controls[data-count="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
 .play-controls[data-count="3"] button:first-child{grid-column:auto}
 .play-controls[data-count="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
}
.notice:empty{min-height:0;margin:0}
footer:has(#storage:empty){display:none}
footer #storage{text-align:center;width:100%}
.site-header{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px}
.site-header strong{min-width:0;overflow-wrap:anywhere;line-height:1.2}
.site-header nav:empty{display:none}
.site-header nav .control-icon{width:20px;height:20px}
.site-tools{display:flex;gap:6px;grid-column:3}
.site-tools .tool-button{display:grid;place-items:center;gap:2px;width:65px;min-height:56px;padding:4px 2px;background:#fffdf6;border-color:#8295a0;font-size:12px;font-weight:750}
.site-tools .tool-button:hover{border-color:#527180}
.site-tools .control-icon{width:25px;height:25px}
.home-page h1{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:820px){
 .site-header{grid-template-columns:minmax(0,1fr) auto;gap:8px}
 .site-header strong{grid-column:1;grid-row:1}
 .site-tools{grid-column:2;grid-row:1}
 .site-header nav{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .site-header nav button{min-width:0;padding-inline:6px;font-size:16px}
}
@media(max-width:380px){
 .play-controls{gap:8px}
 .play-controls button{gap:5px;padding-inline:5px}
 .play-controls .control-icon{width:19px;height:19px}
 .site-tools .tool-button{width:56px}
 .hotspots span{padding:3px 5px;font-size:15px}
}

.menu-page{min-height:0}
.menu-intro{margin:6px 0 18px}
.menu-grid{display:grid;grid-template-columns:repeat(var(--menu-count),minmax(0,1fr));gap:16px}
.menu-grid:not(:has(.menu-card:nth-child(3))){max-width:820px}
.menu-card{--menu-color:#e1eff7;display:grid;grid-template-columns:minmax(0,1fr) 24px;align-items:center;gap:12px;min-width:0;padding:10px 14px 14px;background:var(--menu-color);text-align:left;font-size:clamp(22px,2.6vw,30px);font-weight:750;line-height:1.25}
.menu-card:nth-child(2){--menu-color:#e8efcd}
.menu-card:nth-child(3){--menu-color:#ffebcf}
.menu-picture{display:block;grid-column:1/-1;width:100%;min-width:0;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
.menu-card span{min-width:0;overflow-wrap:anywhere}
.menu-arrow{width:24px;height:24px;object-fit:contain;pointer-events:none}
@media(max-width:700px){
 .menu-grid{grid-template-columns:minmax(0,1fr);gap:10px}
 .menu-card{grid-template-columns:clamp(72px,23vw,112px) minmax(0,1fr) 20px;gap:10px;padding:8px 12px 8px 8px;font-size:clamp(20px,5.4vw,25px)}
 .menu-picture{grid-column:auto;aspect-ratio:4/3}
 .menu-arrow{width:20px;height:20px}
}
@media print{.site-header{display:none}}
</style>
<header class="site-header"><strong>움직여라! 동사 놀이터</strong><nav id="nav" class="row" aria-label="화면 이동"></nav><div class="site-tools" role="group" aria-label="자료 및 설정">
<button class="tool-button" type="button" data-do="go:cards" aria-label="그림카드 모아보기" title="그림카드 모아보기"><img class="control-icon" src="images/ui-cards.webp" alt="" width="28" height="28" draggable="false"><span>그림카드</span></button>
<button class="tool-button" type="button" data-do="go:teacher" aria-label="선생님 설정" title="선생님 설정"><img class="control-icon" src="images/ui-settings.webp" alt="" width="28" height="28" draggable="false"><span>설정</span></button>
</div></header><main id="app"></main><footer id="foot"></footer><div class="print" id="printing"></div><script src="export-images.js" defer></script><script src="app.js" defer></script></html>
